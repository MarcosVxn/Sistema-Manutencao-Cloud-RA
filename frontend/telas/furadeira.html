<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Furadeira - Realidade Aumentada</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            overflow: hidden;

            font-family: Arial, sans-serif;
        }


        /* =====================================
           PAINEL
        ====================================== */

        #painelFuradeira {

            position: fixed;

            left: 50%;

            bottom: 20px;

            transform: translateX(-50%);

            width: min(90%, 400px);

            padding: 20px;

            background:
                rgba(15, 25, 35, 0.95);

            color: white;

            border: 2px solid #f5b400;

            border-radius: 12px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.5);

            z-index: 100;

            display: none;
        }


        #painelFuradeira h2 {

            margin-top: 0;

            color: #f5b400;
        }


        #painelFuradeira p {

            line-height: 1.5;
        }


        .status {

            display: inline-block;

            padding: 6px 12px;

            background: #16803c;

            border-radius: 20px;

            font-size: 13px;

            margin-bottom: 10px;
        }


        .botao {

            width: 100%;

            padding: 12px;

            margin-top: 10px;

            border: none;

            border-radius: 6px;

            background: #f5b400;

            color: #111;

            font-weight: bold;

            cursor: pointer;
        }


        .botao:hover {

            background: #ffc72c;
        }

    </style>

</head>


<body>


    <!-- =====================================
         CENA AR
    ====================================== -->

    <a-scene

        mindar-image="
            imageTargetSrc: ../assets/targets/FuradeiraTargets.mind;
            uiLoading: yes;
            uiScanning: yes;
            uiError: yes;
        "

        vr-mode-ui="enabled: false"

        device-orientation-permission-ui="enabled: false"

        renderer="colorManagement: true">


        <!-- =================================
             CÂMERA
        ================================== -->

        <a-camera

            position="0 0 0"

            look-controls="enabled: false">

        </a-camera>


        <!-- =================================
             TARGET
        ================================== -->

        <a-entity

            id="furadeiraTarget"

            mindar-image-target="targetIndex: 0">


            <!-- =================================
                 PONTO 1 - CABEÇOTE
            ================================== -->

            <a-sphere

                class="hotspot"

                id="hotspotCabecote"

                position="-0.08 0.36 0.1"

                radius="0.05"

                material="color: #f5b400;">

            </a-sphere>


            <!-- =================================
                 PONTO 2 - INTERRUPTOR
            ================================== -->

            <a-sphere

                class="hotspot"

                id="hotspotInterruptor"

                position="0.16 0.36 0.1"

                radius="0.05"

                material="color: #ff4444;">

            </a-sphere>


            <!-- =================================
                 PONTO 3 - MOTOR
            ================================== -->

            <a-sphere

                class="hotspot"

                id="hotspotMotor"

                position="0.15 0.17 0.1"

                radius="0.05"

                material="color: #2196f3;">

            </a-sphere>


            <!-- =================================
                 PONTO 4 - MANDRIL
            ================================== -->

            <a-sphere

                class="hotspot"

                id="hotspotMandril"

                position="-0.02 0.13 0.1"

                radius="0.05"

                material="color: #4caf50;">

            </a-sphere>


            <!-- =================================
                 PONTO 5 - ALAVANCA
            ================================== -->

            <a-sphere

                class="hotspot"

                id="hotspotAlavanca"

                position="0.07 0.08 0.1"

                radius="0.05"

                material="color: #9c27b0;">

            </a-sphere>


            <!-- =================================
                 PONTO 6 - MESA
            ================================== -->

            <a-sphere

                class="hotspot"

                id="hotspotMesa"

                position="-0.02 -0.13 0.1"

                radius="0.05"

                material="color: #ff9800;">

            </a-sphere>


            <!-- =================================
                 PONTO 7 - COLUNA
            ================================== -->

            <a-sphere

                class="hotspot"

                id="hotspotColuna"

                position="0.13 -0.18 0.1"

                radius="0.05"

                material="color: #00bcd4;">

            </a-sphere>


            <!-- =================================
                 PONTO 8 - BASE
            ================================== -->

            <a-sphere

                class="hotspot"

                id="hotspotBase"

                position="-0.02 -0.38 0.1"

                radius="0.05"

                material="color: #795548;">

            </a-sphere>


        </a-entity>

    </a-scene>


    <!-- =====================================
         PAINEL HTML
    ====================================== -->

    <div id="painelFuradeira">


        <span class="status">

            ● EQUIPAMENTO RECONHECIDO

        </span>


        <h2 id="tituloPeca">
            Furadeira Industrial
        </h2>


        <p>

            <strong>Modelo:</strong>

            <span id="modeloPeca">
                FUR-2026
            </span>

        </p>


        <p>

            <strong>Status:</strong>

            <span id="statusPeca">
                Operacional
            </span>

        </p>


        <p>

            <strong>Informações:</strong>

            <span id="descricaoPeca">

                Selecione um ponto da furadeira.

            </span>

        </p>


        <button

            class="botao"

            id="botaoManutencao">

            Procedimentos de manutenção

        </button>


        <button

            class="botao"

            id="botaoFechar">

            Fechar

        </button>


    </div>


    <!-- =====================================
         JAVASCRIPT
    ====================================== -->

    <script>


        /* =====================================
           DADOS
        ====================================== */

        const informacoes = {

            cabecote: {

                titulo: "Cabeçote",

                modelo: "CAB-2026",

                status: "Operacional",

                descricao:
                    "Conjunto superior da furadeira."

            },


            interruptor: {

                titulo: "Interruptor",

                modelo: "INT-220",

                status: "Operacional",

                descricao:
                    "Controla o acionamento da máquina."

            },


            motor: {

                titulo: "Motor",

                modelo: "MTR-500",

                status: "Operacional",

                descricao:
                    "Responsável pelo movimento rotacional."

            },


            mandril: {

                titulo: "Mandril",

                modelo: "MDR-16",

                status: "Operacional",

                descricao:
                    "Responsável pela fixação da broca."

            },


            alavanca: {

                titulo: "Alavanca",

                modelo: "ALV-300",

                status: "Operacional",

                descricao:
                    "Controla o avanço da broca."

            },


            mesa: {

                titulo: "Mesa",

                modelo: "MESA-400",

                status: "Operacional",

                descricao:
                    "Área de apoio da peça de trabalho."

            },


            coluna: {

                titulo: "Coluna",

                modelo: "COL-500",

                status: "Operacional",

                descricao:
                    "Estrutura vertical da máquina."

            },


            base: {

                titulo: "Base",

                modelo: "BAS-600",

                status: "Operacional",

                descricao:
                    "Responsável pela estabilidade."

            }

        };


        /* =====================================
           ABRIR INFORMAÇÃO
        ====================================== */

        function abrirInformacao(tipo) {

            const info =
                informacoes[tipo];


            if (!info) {

                return;

            }


            document
                .querySelector("#tituloPeca")
                .textContent =
                info.titulo;


            document
                .querySelector("#modeloPeca")
                .textContent =
                info.modelo;


            document
                .querySelector("#statusPeca")
                .textContent =
                info.status;


            document
                .querySelector("#descricaoPeca")
                .textContent =
                info.descricao;


            document
                .querySelector("#painelFuradeira")
                .style.display =
                "block";

        }


        /* =====================================
           FECHAR PAINEL
        ====================================== */

        function fecharPainel() {

            document
                .querySelector("#painelFuradeira")
                .style.display =
                "none";

        }


        /* =====================================
           HOTSPOTS
        ====================================== */

        document
            .querySelector("#hotspotCabecote")
            .addEventListener(
                "click",
                () => {

                    abrirInformacao(
                        "cabecote"
                    );

                }
            );


        document
            .querySelector("#hotspotInterruptor")
            .addEventListener(
                "click",
                () => {

                    abrirInformacao(
                        "interruptor"
                    );

                }
            );


        document
            .querySelector("#hotspotMotor")
            .addEventListener(
                "click",
                () => {

                    abrirInformacao(
                        "motor"
                    );

                }
            );


        document
            .querySelector("#hotspotMandril")
            .addEventListener(
                "click",
                () => {

                    abrirInformacao(
                        "mandril"
                    );

                }
            );


        document
            .querySelector("#hotspotAlavanca")
            .addEventListener(
                "click",
                () => {

                    abrirInformacao(
                        "alavanca"
                    );

                }
            );


        document
            .querySelector("#hotspotMesa")
            .addEventListener(
                "click",
                () => {

                    abrirInformacao(
                        "mesa"
                    );

                }
            );


        document
            .querySelector("#hotspotColuna")
            .addEventListener(
                "click",
                () => {

                    abrirInformacao(
                        "coluna"
                    );

                }
            );


        document
            .querySelector("#hotspotBase")
            .addEventListener(
                "click",
                () => {

                    abrirInformacao(
                        "base"
                    );

                }
            );


        /* =====================================
           BOTÃO FECHAR
        ====================================== */

        document
            .querySelector("#botaoFechar")
            .addEventListener(
                "click",
                fecharPainel
            );


        /* =====================================
           BOTÃO MANUTENÇÃO
        ====================================== */

        document
            .querySelector("#botaoManutencao")
            .addEventListener(
                "click",
                () => {

                    alert(
                        "Procedimentos de manutenção"
                    );

                }
            );


        /* =====================================
           TARGET
        ====================================== */

        const target =
            document.querySelector(
                "#furadeiraTarget"
            );


        target.addEventListener(
            "targetFound",
            () => {

                console.log(
                    "================================"
                );

                console.log(
                    "FURADEIRA ENCONTRADA!"
                );

                console.log(
                    "================================"
                );

            }
        );


        target.addEventListener(
            "targetLost",
            () => {

                console.log(
                    "Furadeira perdida"
                );

            }
        );


        /* =====================================
           A-FRAME
        ====================================== */

        const scene =
            document.querySelector(
                "a-scene"
            );


        scene.addEventListener(
            "loaded",
            () => {

                console.log(
                    "A-Frame carregado"
                );

            }
        );


        scene.addEventListener(
            "renderstart",
            () => {

                console.log(
                    "Renderização iniciada"
                );

            }
        );


    </script>

</body>

</html>
