<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Furadeira</title>

    <!-- Biblioteca A-Frame: criação da cena 3D -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- Biblioteca MindAR: reconhecimento e rastreamento da imagem -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>

    <a-scene
    mindar-image="
        imageTargetSrc: ./assets/targets/FuradeiraTargets.mind;
        uiLoading: yes;
        uiScanning: yes;
        uiError: yes;
    "
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera
        position="0 0 0"
        look-controls="enabled: false">
    </a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
        <a-image
            src="./img/imagem.png"
            position="0 0 0.25"
            width="2"
            height="1">
        </a-image>
    </a-entity>

</a-scene>

    </a-scene>

</body>
</html>
