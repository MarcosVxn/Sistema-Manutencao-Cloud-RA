<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Furadeira - Realidade Aumentada</title>


    <!-- =========================================
         A-FRAME
    ========================================== -->

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>


    <!-- =========================================
         MINDAR
    ========================================== -->

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


    <!-- =========================================
         ESTILOS
    ========================================== -->

    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            font-family: Arial, sans-serif;

            background: #000;
        }


        /* =====================================
           PAINEL DE INFORMAÇÕES
        ====================================== */

        #painelFuradeira {

            position: fixed;

            left: 50%;

            bottom: 20px;

            transform: translateX(-50%);

            width: min(90%, 420px);

            max-height: 75vh;

            overflow-y: auto;

            padding: 20px;

            background:
                rgba(15, 25, 35, 0.96);

            color: white;

            border: 2px solid #f5b400;

            border-radius: 14px;

            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.6);

            z-index: 100;

            display: none;

            backdrop-filter: blur(8px);
        }


        #painelFuradeira h2 {

            margin: 8px 0 15px;

            color: #f5b400;

            font-size: 22px;
        }


        #painelFuradeira p {

            line-height: 1.5;

            margin: 8px 0;
        }


        /* =====================================
           STATUS
        ====================================== */

        .status {

            display: inline-block;

            padding: 6px 12px;

            background: #16803c;

            border-radius: 20px;

            font-size: 12px;

            margin-bottom: 5px;
        }


        /* =====================================
           BOTÕES
        ====================================== */

        .botao {

            width: 100%;

            min-height: 44px;

            padding: 12px;

            margin-top: 10px;

            border: none;

            border-radius: 7px;

            background: #f5b400;

            color: #111;

            font-weight: bold;

            cursor: pointer;

            font-size: 15px;
        }


        .botao:hover {

            background: #ffc72c;
        }


        /* =====================================
           BOTÃO FECHAR
        ====================================== */

        .botao.fechar {

            background: #444;

            color: white;
        }


        .botao.fechar:hover {

            background: #555;
        }


        /* =====================================
           INDICADOR DE INSTRUÇÃO
        ====================================== */

        #instrucao {

            position: fixed;

            top: 20px;

            left: 50%;

            transform: translateX(-50%);

            z-index: 90;

            padding: 10px 18px;

            background: rgba(0, 0, 0, 0.75);

            color: white;

            border-radius: 30px;

            font-size: 14px;

            text-align: center;

            pointer-events: none;
        }


        /* =====================================
           TOAST
        ====================================== */

        #toast {

            position: fixed;

            left: 50%;

            top: 75px;

            transform: translateX(-50%);

            z-index: 200;

            padding: 10px 18px;

            border-radius: 20px;

            background: rgba(0, 0, 0, 0.85);

            color: white;

            display: none;

            font-size: 13px;
        }

    </style>

</head>


<body>


    <!-- =====================================
         INSTRUÇÃO
    ====================================== -->

    <div id="instrucao">

        Aponte para a furadeira

    </div>


    <!-- =====================================
         TOAST
    ====================================== -->

    <div id="toast"></div>


    <!-- =====================================
         CENA AR
    ====================================== -->

    <a-scene

        mindar-image="
            imageTargetSrc: ../assets/targets/FuradeiraTargets.mind;
            uiLoading: yes;
            uiScanning: yes;
            uiError: yes;
        "

        vr-mode-ui="enabled: false"

        device-orientation-permission-ui="enabled: false"

        renderer="
            colorManagement: true;
            antialias: true;
        ">


        <!-- =================================
             CÂMERA
        ================================== -->

        <a-camera

            position="0 0 0"

            look-controls="enabled: false"

            cursor="
                rayOrigin: mouse;
                fuse: false;
            "

            raycaster="
                objects: .hotspot;
            ">

        </a-camera>


        <!-- =================================
             TARGET DA FURADEIRA
        ================================== -->

        <a-entity

            id="furadeiraTarget"

            mindar-image-target="targetIndex: 0">


            <!-- =================================
                 HOTSPOT 1
                 CABEÇOTE
            ================================== -->

            <a-entity

                class="hotspot"

                id="hotspotCabecote"

                position="-0.08 0.36 0.05"

                data-tipo="cabecote">

                <a-circle

                    radius="0.045"

                    color="#f5b400"

                    opacity="0.95">

                </a-circle>

                <a-ring

                    radius-inner="0.055"

                    radius-outer="0.075"

                    color="#ffffff"

                    opacity="0.8"

                    animation="

                        property: scale;

                        from: 1 1 1;

                        to: 1.25 1.25 1.25;

                        dir: alternate;

                        loop: true;

                        dur: 900">

                </a-ring>

            </a-entity>


            <!-- =================================
                 HOTSPOT 2
                 INTERRUPTOR
            ================================== -->

            <a-entity

                class="hotspot"

                id="hotspotInterruptor"

                position="0.16 0.36 0.05"

                data-tipo="interruptor">

                <a-circle

                    radius="0.045"

                    color="#ff4d4d">

                </a-circle>

                <a-ring

                    radius-inner="0.055"

                    radius-outer="0.075"

                    color="#ffffff"

                    opacity="0.8">

                </a-ring>

            </a-entity>


            <!-- =================================
                 HOTSPOT 3
                 MOTOR
            ================================== -->

            <a-entity

                class="hotspot"

                id="hotspotMotor"

                position="0.15 0.17 0.05"

                data-tipo="motor">

                <a-circle

                    radius="0.05"

                    color="#2196f3">

                </a-circle>

                <a-ring

                    radius-inner="0.06"

                    radius-outer="0.08"

                    color="#ffffff"

                    opacity="0.8">

                </a-ring>

            </a-entity>


            <!-- =================================
                 HOTSPOT 4
                 MANDRIL
            ================================== -->

            <a-entity

                class="hotspot"

                id="hotspotMandril"

                position="-0.02 0.13 0.06"

                data-tipo="mandril">

                <a-circle

                    radius="0.05"

                    color="#4caf50">

                </a-circle>

                <a-ring

                    radius-inner="0.06"

                    radius-outer="0.08"

                    color="#ffffff"

                    opacity="0.8">

                </a-ring>

            </a-entity>


            <!-- =================================
                 HOTSPOT 5
                 ALAVANCA
            ================================== -->

            <a-entity

                class="hotspot"

                id="hotspotAlavanca"

                position="0.07 0.08 0.06"

                data-tipo="alavanca">

                <a-circle

                    radius="0.045"

                    color="#9c27b0">

                </a-circle>

                <a-ring

                    radius-inner="0.055"

                    radius-outer="0.075"

                    color="#ffffff"

                    opacity="0.8">

                </a-ring>

            </a-entity>


            <!-- =================================
                 HOTSPOT 6
                 MESA
            ================================== -->

            <a-entity

                class="hotspot"

                id="hotspotMesa"

                position="-0.02 -0.13 0.05"

                data-tipo="mesa">

                <a-circle

                    radius="0.05"

                    color="#ff9800">

                </a-circle>

                <a-ring

                    radius-inner="0.06"

                    radius-outer="0.08"

                    color="#ffffff"

                    opacity="0.8">

                </a-ring>

            </a-entity>


            <!-- =================================
                 HOTSPOT 7
                 COLUNA
            ================================== -->

            <a-entity

                class="hotspot"

                id="hotspotColuna"

                position="0.13 -0.18 0.05"

                data-tipo="coluna">

                <a-circle

                    radius="0.045"

                    color="#00bcd4">

                </a-circle>

                <a-ring

                    radius-inner="0.055"

                    radius-outer="0.075"

                    color="#ffffff"

                    opacity="0.8">

                </a-ring>

            </a-entity>


            <!-- =================================
                 HOTSPOT 8
                 BASE
            ================================== -->

            <a-entity

                class="hotspot"

                id="hotspotBase"

                position="-0.02 -0.38 0.05"

                data-tipo="base">

                <a-circle

                    radius="0.055"

                    color="#795548">

                </a-circle>

                <a-ring

                    radius-inner="0.065"

                    radius-outer="0.085"

                    color="#ffffff"

                    opacity="0.8">

                </a-ring>

            </a-entity>


        </a-entity>


    </a-scene>


    <!-- =====================================
         PAINEL
    ====================================== -->

    <div id="painelFuradeira">


        <span class="status">

            ● EQUIPAMENTO RECONHECIDO

        </span>


        <h2 id="tituloPeca">

            Furadeira Industrial

        </h2>


        <p>

            <strong>Modelo:</strong>

            <span id="modeloPeca">
                FUR-2026
            </span>

        </p>


        <p>

            <strong>Status:</strong>

            <span id="statusPeca">
                Operacional
            </span>

        </p>


        <p>

            <strong>Informações:</strong>

            <span id="descricaoPeca">
                Selecione um ponto da furadeira.
            </span>

        </p>


        <p>

            <strong>Função:</strong>

            <span id="funcaoPeca">
                -
            </span>

        </p>


        <button

            class="botao"

            id="botaoManutencao">

            Procedimentos de manutenção

        </button>


        <button

            class="botao fechar"

            id="botaoFechar">

            Fechar

        </button>


    </div>


    <!-- =====================================
         JAVASCRIPT
    ====================================== -->

    <script>


        /* =====================================
           DADOS DOS COMPONENTES
        ====================================== */

        const informacoes = {


            cabecote: {

                titulo: "Cabeçote",

                modelo: "CAB-2026",

                status: "Operacional",

                descricao:
                    "Conjunto superior responsável por abrigar parte do sistema de acionamento e transmissão da furadeira.",

                funcao:
                    "Abrigar os mecanismos responsáveis pelo acionamento da ferramenta."

            },


            interruptor: {

                titulo: "Interruptor",

                modelo: "INT-220",

                status: "Operacional",

                descricao:
                    "Interruptor principal utilizado para ligar e desligar o equipamento.",

                funcao:
                    "Controlar a alimentação elétrica da máquina."

            },


            motor: {

                titulo: "Motor",

                modelo: "MTR-500",

                status: "Operacional",

                descricao:
                    "Motor elétrico responsável por fornecer a potência necessária para o sistema de perfuração.",

                funcao:
                    "Converter energia elétrica em movimento rotacional."

            },


            mandril: {

                titulo: "Mandril",

                modelo: "MDR-16",

                status: "Operacional",

                descricao:
                    "Componente responsável por prender e centralizar a broca.",

                funcao:
                    "Fixar a ferramenta de corte utilizada na operação."

            },


            alavanca: {

                titulo: "Alavanca de avanço",

                modelo: "ALV-300",

                status: "Operacional",

                descricao:
                    "Mecanismo utilizado para movimentar verticalmente o conjunto de perfuração.",

                funcao:
                    "Controlar o avanço da broca durante a operação."

            },


            mesa: {

                titulo: "Mesa de trabalho",

                modelo: "MESA-400",

                status: "Operacional",

                descricao:
                    "Superfície onde a peça de trabalho é apoiada durante a operação.",

                funcao:
                    "Sustentar e posicionar a peça que será perfurada."

            },


            coluna: {

                titulo: "Coluna",

                modelo: "COL-500",

                status: "Operacional",

                descricao:
                    "Estrutura vertical que sustenta o conjunto superior da máquina.",

                funcao:
                    "Garantir sustentação e alinhamento do conjunto."

            },


            base: {

                titulo: "Base",

                modelo: "BAS-600",

                status: "Operacional",

                descricao:
                    "Estrutura inferior responsável por apoiar e estabilizar a furadeira.",

                funcao:
                    "Proporcionar estabilidade ao equipamento durante a operação."

            }

        };


        /* =====================================
           ELEMENTOS HTML
        ====================================== */

        const painel =
            document.querySelector("#painelFuradeira");

        const titulo =
            document.querySelector("#tituloPeca");

        const modelo =
            document.querySelector("#modeloPeca");

        const status =
            document.querySelector("#statusPeca");

        const descricao =
            document.querySelector("#descricaoPeca");

        const funcao =
            document.querySelector("#funcaoPeca");

        const instrucao =
            document.querySelector("#instrucao");

        const toast =
            document.querySelector("#toast");


        /* =====================================
           ABRIR INFORMAÇÕES
        ====================================== */

        function abrirInformacao(tipo) {


            const info =
                informacoes[tipo];


            if (!info) {

                console.warn(
                    "Informação não encontrada:",
                    tipo
                );

                return;

            }


            titulo.textContent =
                info.titulo;


            modelo.textContent =
                info.modelo;


            status.textContent =
                info.status;


            descricao.textContent =
                info.descricao;


            funcao.textContent =
                info.funcao;


            painel.style.display =
                "block";


            instrucao.style.display =
                "none";


            console.log(
                "Hotspot selecionado:",
                tipo
            );

        }


        /* =====================================
           FECHAR PAINEL
        ====================================== */

        function fecharPainel() {

            painel.style.display =
                "none";

            instrucao.style.display =
                "block";

        }


        /* =====================================
           MANUTENÇÃO
        ====================================== */

        function mostrarManutencao() {

            mostrarToast(
                "Procedimentos de manutenção selecionados."
            );

        }


        /* =====================================
           TOAST
        ====================================== */

        function mostrarToast(mensagem) {

            toast.textContent =
                mensagem;

            toast.style.display =
                "block";


            setTimeout(() => {

                toast.style.display =
                    "none";

            }, 2500);

        }


        /* =====================================
           CONFIGURAÇÃO DOS HOTSPOTS
        ====================================== */

        document
            .querySelectorAll(".hotspot")
            .forEach(hotspot => {


                hotspot.addEventListener(
                    "click",
                    function () {


                        const tipo =
                            this.dataset.tipo;


                        abrirInformacao(tipo);

                    }
                );


            });


        /* =====================================
           BOTÕES
        ====================================== */

        document
            .querySelector("#botaoFechar")
            .addEventListener(
                "click",
                fecharPainel
            );


        document
            .querySelector("#botaoManutencao")
            .addEventListener(
                "click",
                mostrarManutencao
            );


        /* =====================================
           MINDAR
        ====================================== */

        const target =
            document.querySelector(
                "#furadeiraTarget"
            );


        target.addEventListener(
            "targetFound",
            () => {


                console.log(
                    "================================"
                );

                console.log(
                    "FURADEIRA ENCONTRADA!"
                );

                console.log(
                    "================================"
                );


                instrucao.textContent =
                    "Toque nos pontos para obter informações";


                instrucao.style.display =
                    "block";

            }
        );


        target.addEventListener(
            "targetLost",
            () => {


                console.log(
                    "Furadeira perdida"
                );


                painel.style.display =
                    "none";


                instrucao.textContent =
                    "Aponte para a furadeira";

            }
        );


        /* =====================================
           A-FRAME
        ====================================== */

        const scene =
            document.querySelector("a-scene");


        scene.addEventListener(
            "loaded",
            () => {

                console.log(
                    "A-Frame carregado"
                );

            }
        );


        scene.addEventListener(
            "renderstart",
            () => {

                console.log(
                    "Renderização iniciada"
                );

            }
        );


    </script>


</body>

</html>
