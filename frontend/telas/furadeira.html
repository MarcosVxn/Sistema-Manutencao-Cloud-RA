<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Furadeira - Realidade Aumentada</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            overflow: hidden;

            font-family: Arial, sans-serif;

            background: #000;
        }


        /* =====================================================
           PAINEL
        ====================================================== */

        #painelFuradeira {

            position: fixed;

            left: 50%;

            bottom: 20px;

            transform: translateX(-50%);

            width: min(90%, 420px);

            max-height: 70vh;

            overflow-y: auto;

            padding: 20px;

            background:
                rgba(15, 25, 35, 0.96);

            color: white;

            border: 2px solid #f5b400;

            border-radius: 14px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.5);

            z-index: 100;

            display: none;
        }


        #painelFuradeira h2 {

            margin-top: 0;

            color: #f5b400;

        }


        #painelFuradeira p {

            line-height: 1.5;

        }


        /* =====================================================
           STATUS
        ====================================================== */

        .status {

            display: inline-block;

            padding: 6px 12px;

            background: #16803c;

            border-radius: 20px;

            font-size: 13px;

            margin-bottom: 10px;
        }


        /* =====================================================
           BOTÃO
        ====================================================== */

        .botao {

            width: 100%;

            padding: 12px;

            margin-top: 10px;

            border: none;

            border-radius: 6px;

            background: #f5b400;

            color: #111;

            font-weight: bold;

            cursor: pointer;

            font-size: 15px;

            touch-action: manipulation;
        }


        .botao:active {

            background: #ffc72c;

        }


    </style>

</head>


<body>


    <!-- =====================================================
         CENA AR

         IMPORTANTE:
         Esta configuração é a mesma estrutura que já
         estava funcionando.
    ====================================================== -->

    <a-scene

        id="ar-scene"

        mindar-image="
            imageTargetSrc: ../assets/targets/FuradeiraTargets.mind;
            uiLoading: yes;
            uiScanning: yes;
            uiError: yes;
        "

        vr-mode-ui="enabled: false"

        device-orientation-permission-ui="enabled: false"

        renderer="colorManagement: true">


        <!-- =================================================
             CÂMERA
        ================================================== -->

        <a-camera

            id="ar-camera"

            position="0 0 0"

            look-controls="enabled: false">

        </a-camera>


        <!-- =================================================
             TARGET
        ================================================== -->

        <a-entity

            id="target"

            mindar-image-target="targetIndex: 0">


            <!-- =================================================
                 PONTO 1 - CABEÇOTE
            ================================================== -->

            <a-sphere

                class="hotspot"

                data-topic="cabecote"

                position="-0.08 0.36 0.1"

                radius="0.05"

                material="
                    color: #f5b400;
                    shader: standard;
                ">

            </a-sphere>


            <!-- =================================================
                 PONTO 2 - INTERRUPTOR
            ================================================== -->

            <a-sphere

                class="hotspot"

                data-topic="interruptor"

                position="0.16 0.36 0.1"

                radius="0.05"

                material="
                    color: #ff4444;
                    shader: standard;
                ">

            </a-sphere>


            <!-- =================================================
                 PONTO 3 - MOTOR
            ================================================== -->

            <a-sphere

                class="hotspot"

                data-topic="motor"

                position="0.15 0.17 0.1"

                radius="0.05"

                material="
                    color: #2196f3;
                    shader: standard;
                ">

            </a-sphere>


            <!-- =================================================
                 PONTO 4 - MANDRIL
            ================================================== -->

            <a-sphere

                class="hotspot"

                data-topic="mandril"

                position="-0.02 0.13 0.1"

                radius="0.05"

                material="
                    color: #4caf50;
                    shader: standard;
                ">

            </a-sphere>


            <!-- =================================================
                 PONTO 5 - ALAVANCA
            ================================================== -->

            <a-sphere

                class="hotspot"

                data-topic="alavanca"

                position="0.07 0.08 0.1"

                radius="0.05"

                material="
                    color: #9c27b0;
                    shader: standard;
                ">

            </a-sphere>


            <!-- =================================================
                 PONTO 6 - MESA
            ================================================== -->

            <a-sphere

                class="hotspot"

                data-topic="mesa"

                position="-0.02 -0.13 0.1"

                radius="0.05"

                material="
                    color: #ff9800;
                    shader: standard;
                ">

            </a-sphere>


            <!-- =================================================
                 PONTO 7 - COLUNA
            ================================================== -->

            <a-sphere

                class="hotspot"

                data-topic="coluna"

                position="0.13 -0.18 0.1"

                radius="0.05"

                material="
                    color: #00bcd4;
                    shader: standard;
                ">

            </a-sphere>


            <!-- =================================================
                 PONTO 8 - BASE
            ================================================== -->

            <a-sphere

                class="hotspot"

                data-topic="base"

                position="-0.02 -0.38 0.1"

                radius="0.05"

                material="
                    color: #795548;
                    shader: standard;
                ">

            </a-sphere>


        </a-entity>

    </a-scene>


    <!-- =====================================================
         PAINEL HTML
    ====================================================== -->

    <div id="painelFuradeira">


        <span class="status">

            ● EQUIPAMENTO RECONHECIDO

        </span>


        <h2 id="tituloPeca">

            Componente

        </h2>


        <p>

            <strong>Descrição:</strong>

        </p>

        <p id="descricaoPeca">

            -

        </p>


        <p>

            <strong>Detalhes:</strong>

        </p>

        <p id="detalhesPeca">

            -

        </p>


        <button

            id="botaoManutencao"

            class="botao">

            Procedimentos de manutenção

        </button>


        <button

            id="botaoFechar"

            class="botao">

            Fechar

        </button>


    </div>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            () => {


                /* =================================================
                   REFERÊNCIAS
                ================================================= */

                const scene =
                    document.querySelector(
                        "#ar-scene"
                    );


                const target =
                    document.querySelector(
                        "#target"
                    );


                const painel =
                    document.querySelector(
                        "#painelFuradeira"
                    );


                const titulo =
                    document.querySelector(
                        "#tituloPeca"
                    );


                const descricao =
                    document.querySelector(
                        "#descricaoPeca"
                    );


                const detalhes =
                    document.querySelector(
                        "#detalhesPeca"
                    );


                const botaoFechar =
                    document.querySelector(
                        "#botaoFechar"
                    );


                const botaoManutencao =
                    document.querySelector(
                        "#botaoManutencao"
                    );


                const hotspots =
                    Array.from(
                        document.querySelectorAll(
                            ".hotspot"
                        )
                    );


                /* =================================================
                   BANCO DE INFORMAÇÕES
                ================================================= */

                const information = {


                    cabecote: {

                        title:
                            "Cabeçote",

                        text:
                            "Conjunto superior da furadeira responsável por abrigar o sistema de acionamento e transmissão.",

                        detail:
                            "Verifique fixações, ruídos anormais, vibrações e sinais de desgaste."

                    },


                    interruptor: {

                        title:
                            "Interruptor",

                        text:
                            "Componente utilizado para ligar e desligar o equipamento.",

                        detail:
                            "Antes de qualquer manutenção elétrica, desligue a alimentação da máquina."

                    },


                    motor: {

                        title:
                            "Motor",

                        text:
                            "Motor elétrico responsável por fornecer o movimento rotacional necessário para a perfuração.",

                        detail:
                            "Observe aquecimento excessivo, ruídos, vibrações ou alterações no funcionamento."

                    },


                    mandril: {

                        title:
                            "Mandril",

                        text:
                            "Componente responsável pela fixação da broca.",

                        detail:
                            "A broca deve estar corretamente centralizada e firmemente presa antes da operação."

                    },


                    alavanca: {

                        title:
                            "Alavanca de avanço",

                        text:
                            "Mecanismo utilizado para movimentar verticalmente o conjunto de perfuração.",

                        detail:
                            "O movimento deve ocorrer de maneira controlada e sem travamentos."

                    },


                    mesa: {

                        title:
                            "Mesa de trabalho",

                        text:
                            "Superfície utilizada para apoiar a peça durante a operação.",

                        detail:
                            "Verifique se a peça está corretamente apoiada e fixada."

                    },


                    coluna: {

                        title:
                            "Coluna",

                        text:
                            "Estrutura vertical responsável pela sustentação do conjunto superior.",

                        detail:
                            "A coluna contribui para o alinhamento e estabilidade da máquina."

                    },


                    base: {

                        title:
                            "Base",

                        text:
                            "Estrutura inferior responsável pelo apoio e estabilidade da furadeira.",

                        detail:
                            "Verifique regularmente a fixação e estabilidade da máquina."

                    }

                };


                /* =================================================
                   ABRIR INFORMAÇÃO
                ================================================= */

                function showInformation(
                    topicName
                ) {


                    const selected =
                        information[
                            topicName
                        ];


                    if (!selected) {

                        console.warn(
                            "Informação não encontrada:",
                            topicName
                        );

                        return;

                    }


                    titulo.textContent =
                        selected.title;


                    descricao.textContent =
                        selected.text;


                    detalhes.textContent =
                        selected.detail;


                    painel.style.display =
                        "block";

                }


                /* =================================================
                   FECHAR PAINEL
                ================================================= */

                function hideInformation() {

                    painel.style.display =
                        "none";

                }


                /* =================================================
                   EVENTOS DOS HOTSPOTS
                   
                   IMPORTANTE:
                   Não usamos raycaster.
                   Não usamos THREE.Vector3.
                   Não usamos posicionamento HTML.
                ================================================= */

                hotspots.forEach(
                    (hotspot) => {


                        hotspot.addEventListener(
                            "click",
                            () => {


                                const topic =
                                    hotspot.dataset.topic;


                                showInformation(
                                    topic
                                );

                            }
                        );


                    }
                );


                /* =================================================
                   FECHAR PAINEL
                ================================================= */

                botaoFechar.addEventListener(
                    "click",
                    () => {

                        hideInformation();

                    }
                );


                /* =================================================
                   MANUTENÇÃO
                ================================================= */

                botaoManutencao.addEventListener(
                    "click",
                    () => {

                        alert(
                            "Procedimentos de manutenção serão disponibilizados aqui."
                        );

                    }
                );


                /* =================================================
                   TARGET ENCONTRADO
                ================================================= */

                target.addEventListener(
                    "targetFound",
                    () => {

                        console.log(
                            "Furadeira encontrada."
                        );

                    }
                );


                /* =================================================
                   TARGET PERDIDO
                ================================================= */

                target.addEventListener(
                    "targetLost",
                    () => {

                        console.log(
                            "Furadeira perdida."
                        );


                        hideInformation();

                    }
                );


                /* =================================================
                   AR PRONTO
                ================================================= */

                scene.addEventListener(
                    "arReady",
                    () => {

                        console.log(
                            "AR pronto."
                        );

                    }
                );


                /* =================================================
                   ERRO AR
                ================================================= */

                scene.addEventListener(
                    "arError",
                    () => {

                        console.error(
                            "Erro ao iniciar AR."
                        );

                    }
                );

            }
        );

    </script>

</body>

</html>
