<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Furadeira - Realidade Aumentada</title>

    <!-- A-FRAME -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- MINDAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            overflow: hidden;

            font-family: Arial, sans-serif;

        }


        /* ==========================================
           PAINEL
        ========================================== */

        #painelFuradeira {

            position: fixed;

            left: 50%;

            bottom: 20px;

            transform: translateX(-50%);

            width: min(90%, 400px);

            padding: 20px;

            background:
                rgba(15, 25, 35, 0.95);

            color: white;

            border: 2px solid #f5b400;

            border-radius: 12px;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.5);

            z-index: 100;

            display: none;

        }


        #painelFuradeira h2 {

            margin-top: 0;

            color: #f5b400;

        }


        #painelFuradeira p {

            line-height: 1.5;

        }


        .status {

            display: inline-block;

            padding: 6px 12px;

            background: #16803c;

            border-radius: 20px;

            font-size: 13px;

            margin-bottom: 10px;

        }


        .botao {

            width: 100%;

            padding: 12px;

            margin-top: 10px;

            border: none;

            border-radius: 6px;

            background: #f5b400;

            color: #111;

            font-weight: bold;

            cursor: pointer;

        }


        /* Marcadores AR: núcleo luminoso + aro pulsante */
        .hotspot-marker {
            filter: drop-shadow(0 0 7px rgba(255, 190, 70, .9));
        }
        #painelFuradeira {
            border: 1px solid rgba(255, 196, 82, .9) !important;
            border-radius: 20px !important;
            background: linear-gradient(145deg, rgba(15, 27, 43, .97), rgba(7, 14, 25, .97)) !important;
            box-shadow: 0 16px 45px rgba(0,0,0,.48), 0 0 0 1px rgba(255,255,255,.08) inset !important;
            backdrop-filter: blur(12px);
            max-height: min(68vh, 520px);
            overflow-y: auto;
        }
        #painelFuradeira h2 {
            color: #ffd071 !important;
            font-size: 23px;
            letter-spacing: .2px;
            margin-bottom: 14px;
        }
        #painelFuradeira p { color: #e4ebf5; font-size: 14px; }
        #painelFuradeira .status {
            background: rgba(255, 190, 70, .14);
            border: 1px solid rgba(255, 190, 70, .45);
            color: #ffd071;
            letter-spacing: .7px;
            font-weight: 700;
            font-size: 11px;
        }
        .botao {
            border-radius: 12px !important;
            background: linear-gradient(135deg, #ffd071, #f0a928) !important;
            box-shadow: 0 6px 18px rgba(240,169,40,.22);
            transition: transform .18s ease, filter .18s ease;
        }
        .botao:active { transform: scale(.98); filter: brightness(1.08); }

    </style>

</head>


<body>


    <!-- ==========================================
         CENA AR

         NÃO ALTERAMOS A CONFIGURAÇÃO QUE
         ESTAVA FUNCIONANDO.
    ========================================== -->

    <a-scene

        mindar-image="
            imageTargetSrc: ../assets/targets/FuradeiraTargets.mind;
            uiLoading: yes;
            uiScanning: yes;
            uiError: yes;
        "

        vr-mode-ui="enabled: false"

        device-orientation-permission-ui="enabled: false"

        renderer="colorManagement: true">


        <!-- CÂMERA -->

        <a-camera
            position="0 0 0"
            look-controls="enabled: false"
            cursor="rayOrigin: mouse; fuse: false"
            raycaster="objects: .hotspot; far: 20">
        </a-camera>


        <!-- TARGET -->

        <a-entity

            id="furadeiraTarget"

            mindar-image-target="targetIndex: 0">


            <!-- ======================================
                 PONTO 1
            ======================================= -->

            <a-sphere

                class="hotspot"

                data-topic="cabecote"

                position="-0.08 0.36 0.1"

                radius="0.033"

                material="color: #ffc45c; emissive: #ffad32; emissiveIntensity: 0.85; metalness: 0.25; roughness: 0.22">
                <a-torus class="hotspot-marker" radius="0.055" radius-tubular="0.006" segments-radial="8" segments-tubular="48" material="color: #fff2d6; emissive: #ffbf55; emissiveIntensity: 0.65; metalness: 0.1; roughness: 0.25" animation__pulse="property: scale; to: 1.22 1.22 1.22; dir: alternate; dur: 900; loop: true; easing: easeInOutSine"></a-torus>

            </a-sphere>


            <!-- ======================================
                 PONTO 2
            ======================================= -->

            <a-sphere

                class="hotspot"

                data-topic="interruptor"

                position="0.16 0.36 0.1"

                radius="0.033"

                material="color: #ffc45c; emissive: #ffad32; emissiveIntensity: 0.85; metalness: 0.25; roughness: 0.22">
                <a-torus class="hotspot-marker" radius="0.055" radius-tubular="0.006" segments-radial="8" segments-tubular="48" material="color: #fff2d6; emissive: #ffbf55; emissiveIntensity: 0.65; metalness: 0.1; roughness: 0.25" animation__pulse="property: scale; to: 1.22 1.22 1.22; dir: alternate; dur: 900; loop: true; easing: easeInOutSine"></a-torus>

            </a-sphere>


            <!-- ======================================
                 PONTO 3
            ======================================= -->

            <a-sphere

                class="hotspot"

                data-topic="motor"

                position="0.15 0.17 0.1"

                radius="0.033"

                material="color: #ffc45c; emissive: #ffad32; emissiveIntensity: 0.85; metalness: 0.25; roughness: 0.22">
                <a-torus class="hotspot-marker" radius="0.055" radius-tubular="0.006" segments-radial="8" segments-tubular="48" material="color: #fff2d6; emissive: #ffbf55; emissiveIntensity: 0.65; metalness: 0.1; roughness: 0.25" animation__pulse="property: scale; to: 1.22 1.22 1.22; dir: alternate; dur: 900; loop: true; easing: easeInOutSine"></a-torus>

            </a-sphere>


            <!-- ======================================
                 PONTO 4
            ======================================= -->

            <a-sphere

                class="hotspot"

                data-topic="mandril"

                position="-0.02 0.13 0.1"

                radius="0.033"

                material="color: #ffc45c; emissive: #ffad32; emissiveIntensity: 0.85; metalness: 0.25; roughness: 0.22">
                <a-torus class="hotspot-marker" radius="0.055" radius-tubular="0.006" segments-radial="8" segments-tubular="48" material="color: #fff2d6; emissive: #ffbf55; emissiveIntensity: 0.65; metalness: 0.1; roughness: 0.25" animation__pulse="property: scale; to: 1.22 1.22 1.22; dir: alternate; dur: 900; loop: true; easing: easeInOutSine"></a-torus>

            </a-sphere>


            <!-- ======================================
                 PONTO 5
            ======================================= -->

            <a-sphere

                class="hotspot"

                data-topic="alavanca"

                position="0.07 0.08 0.1"

                radius="0.033"

                material="color: #ffc45c; emissive: #ffad32; emissiveIntensity: 0.85; metalness: 0.25; roughness: 0.22">
                <a-torus class="hotspot-marker" radius="0.055" radius-tubular="0.006" segments-radial="8" segments-tubular="48" material="color: #fff2d6; emissive: #ffbf55; emissiveIntensity: 0.65; metalness: 0.1; roughness: 0.25" animation__pulse="property: scale; to: 1.22 1.22 1.22; dir: alternate; dur: 900; loop: true; easing: easeInOutSine"></a-torus>

            </a-sphere>


            <!-- ======================================
                 PONTO 6
            ======================================= -->

            <a-sphere

                class="hotspot"

                data-topic="mesa"

                position="-0.02 -0.13 0.1"

                radius="0.033"

                material="color: #ffc45c; emissive: #ffad32; emissiveIntensity: 0.85; metalness: 0.25; roughness: 0.22">
                <a-torus class="hotspot-marker" radius="0.055" radius-tubular="0.006" segments-radial="8" segments-tubular="48" material="color: #fff2d6; emissive: #ffbf55; emissiveIntensity: 0.65; metalness: 0.1; roughness: 0.25" animation__pulse="property: scale; to: 1.22 1.22 1.22; dir: alternate; dur: 900; loop: true; easing: easeInOutSine"></a-torus>

            </a-sphere>


            <!-- ======================================
                 PONTO 7
            ======================================= -->

            <a-sphere

                class="hotspot"

                data-topic="coluna"

                position="0.13 -0.18 0.1"

                radius="0.033"

                material="color: #ffc45c; emissive: #ffad32; emissiveIntensity: 0.85; metalness: 0.25; roughness: 0.22">
                <a-torus class="hotspot-marker" radius="0.055" radius-tubular="0.006" segments-radial="8" segments-tubular="48" material="color: #fff2d6; emissive: #ffbf55; emissiveIntensity: 0.65; metalness: 0.1; roughness: 0.25" animation__pulse="property: scale; to: 1.22 1.22 1.22; dir: alternate; dur: 900; loop: true; easing: easeInOutSine"></a-torus>

            </a-sphere>


            <!-- ======================================
                 PONTO 8
            ======================================= -->

            <a-sphere

                class="hotspot"

                data-topic="base"

                position="-0.02 -0.38 0.1"

                radius="0.033"

                material="color: #ffc45c; emissive: #ffad32; emissiveIntensity: 0.85; metalness: 0.25; roughness: 0.22">
                <a-torus class="hotspot-marker" radius="0.055" radius-tubular="0.006" segments-radial="8" segments-tubular="48" material="color: #fff2d6; emissive: #ffbf55; emissiveIntensity: 0.65; metalness: 0.1; roughness: 0.25" animation__pulse="property: scale; to: 1.22 1.22 1.22; dir: alternate; dur: 900; loop: true; easing: easeInOutSine"></a-torus>

            </a-sphere>


        </a-entity>

    </a-scene>


    <!-- ==========================================
         PAINEL
    ========================================== -->

    <div id="painelFuradeira">


        <span class="status">

            ● COMPONENTE SELECIONADO

        </span>


        <h2 id="tituloPeca">
            Componente
        </h2>


        <p>

            <strong>Descrição:</strong>

        </p>


        <p id="descricaoPeca">
            -
        </p>


        <p>

            <strong>Detalhes:</strong>

        </p>


        <p id="detalhesPeca">
            -
        </p>


        <button
            id="botaoFechar"
            class="botao">

            Fechar

        </button>


    </div>


    <!-- ==========================================
         JAVASCRIPT
    ========================================== -->

    <script>


        document.addEventListener(
            "DOMContentLoaded",
            () => {


                /* ======================================
                   ELEMENTOS
                ======================================= */

                const target =
                    document.querySelector(
                        "#furadeiraTarget"
                    );


                const painel =
                    document.querySelector(
                        "#painelFuradeira"
                    );


                const titulo =
                    document.querySelector(
                        "#tituloPeca"
                    );


                const descricao =
                    document.querySelector(
                        "#descricaoPeca"
                    );


                const detalhes =
                    document.querySelector(
                        "#detalhesPeca"
                    );


                const botaoFechar =
                    document.querySelector(
                        "#botaoFechar"
                    );


                const hotspots =
                    document.querySelectorAll(
                        ".hotspot"
                    );


                /* ======================================
                   INFORMAÇÕES
                ======================================= */

                const information = {


                    cabecote: {

                        title: "Cabeçote",

                        text:
                            "Conjunto superior da furadeira responsável pelo acionamento e transmissão.",

                        detail:
                            "Verifique fixações, ruídos, vibrações e sinais de desgaste."

                    },


                    interruptor: {

                        title: "Interruptor",

                        text:
                            "Componente utilizado para ligar e desligar o equipamento.",

                        detail:
                            "Antes de manutenção elétrica, desligue a alimentação da máquina."

                    },


                    motor: {

                        title: "Motor",

                        text:
                            "Motor elétrico responsável pelo movimento rotacional.",

                        detail:
                            "Observe aquecimento excessivo, ruídos e vibrações."

                    },


                    mandril: {

                        title: "Mandril",

                        text:
                            "Componente responsável pela fixação da broca.",

                        detail:
                            "Certifique-se de que a broca está corretamente fixada."

                    },


                    alavanca: {

                        title: "Alavanca de avanço",

                        text:
                            "Mecanismo utilizado para movimentar o conjunto de perfuração.",

                        detail:
                            "O movimento deve ocorrer de forma controlada."

                    },


                    mesa: {

                        title: "Mesa de trabalho",

                        text:
                            "Superfície utilizada para apoiar a peça.",

                        detail:
                            "A peça deve estar corretamente apoiada e fixada."

                    },


                    coluna: {

                        title: "Coluna",

                        text:
                            "Estrutura vertical que sustenta o conjunto superior.",

                        detail:
                            "Contribui para o alinhamento e estabilidade."

                    },


                    base: {

                        title: "Base",

                        text:
                            "Estrutura inferior responsável pelo apoio da furadeira.",

                        detail:
                            "Verifique a fixação e estabilidade da máquina."

                    }

                };


                /* ======================================
                   MOSTRAR INFORMAÇÃO
                ======================================= */

                function mostrarInformacao(
                    topic
                ) {


                    const info =
                        information[topic];


                    if (!info) {

                        return;

                    }


                    titulo.textContent =
                        info.title;


                    descricao.textContent =
                        info.text;


                    detalhes.textContent =
                        info.detail;


                    painel.style.display =
                        "block";

                }


                /* ======================================
                   FECHAR
                ======================================= */

                function fecharPainel() {

                    painel.style.display =
                        "none";

                }


                
                /* ======================================
                   INTERAÇÃO DOS PONTOS AR (ANDROID/CHROME)
                   O listener fica no document em fase capture,
                   pois no celular o toque pode atingir a camada
                   do vídeo da câmera em vez do canvas do A-Frame.
                ======================================= */

                const scene = document.querySelector("a-scene");
                const raycaster = new THREE.Raycaster();
                const ponteiro = new THREE.Vector2();
                let interacaoInstalada = false;
                let ultimoToqueProcessado = 0;

                hotspots.forEach((hotspot) => {
                    hotspot.classList.add("clickable");
                    hotspot.setAttribute("visible", "true");
                });

                function selecionarHotspot(clientX, clientY) {
                    if (!scene || !scene.canvas || !scene.camera) return false;

                    const canvas = scene.canvas;
                    const rect = canvas.getBoundingClientRect();
                    if (!rect.width || !rect.height) return false;

                    // Converte a posição do toque para coordenadas normalizadas (-1 a 1).
                    ponteiro.x = ((clientX - rect.left) / rect.width) * 2 - 1;
                    ponteiro.y = -((clientY - rect.top) / rect.height) * 2 + 1;

                    // Atualiza as matrizes antes de calcular a interseção.
                    scene.camera.updateMatrixWorld(true);
                    scene.object3D.updateMatrixWorld(true);

                    const objetos = Array.from(hotspots)
                        .filter((hotspot) => {
                            return hotspot.object3D &&
                                hotspot.object3D.visible &&
                                hotspot.getAttribute("visible") !== false;
                        })
                        .map((hotspot) => hotspot.object3D);

                    raycaster.setFromCamera(ponteiro, scene.camera);
                    const intersecoes = raycaster.intersectObjects(objetos, true);
                    if (!intersecoes.length) return false;

                    // Sobe na hierarquia Three.js até encontrar o elemento A-Frame.
                    let objeto = intersecoes[0].object;
                    let hotspotSelecionado = null;
                    while (objeto && !hotspotSelecionado) {
                        const elemento = objeto.el;
                        if (elemento && elemento.classList && elemento.classList.contains("hotspot")) {
                            hotspotSelecionado = elemento;
                        }
                        objeto = objeto.parent;
                    }

                    if (!hotspotSelecionado) return false;

                    const topic = hotspotSelecionado.getAttribute("data-topic");
                    console.log("Hotspot selecionado:", topic);
                    mostrarInformacao(topic);
                    return true;
                }

                function tratarPonteiro(event) {
                    // Não tenta selecionar objetos quando o toque é dentro da ficha.
                    if (painel.contains(event.target)) return;
                    if (event.pointerType === "mouse" && event.button !== 0) return;

                    const agora = Date.now();
                    if (agora - ultimoToqueProcessado < 250) return;

                    if (selecionarHotspot(event.clientX, event.clientY)) {
                        ultimoToqueProcessado = agora;
                        event.preventDefault();
                        event.stopPropagation();
                    }
                }

                function instalarInteracaoHotspots() {
                    if (interacaoInstalada || !scene.canvas || !scene.camera) return;
                    interacaoInstalada = true;

                    // Captura antes dos elementos internos (inclusive o vídeo/canvas).
                    document.addEventListener("pointerup", tratarPonteiro, true);

                    // Compatibilidade adicional para navegadores sem Pointer Events.
                    if (!window.PointerEvent) {
                        document.addEventListener("touchend", (event) => {
                            if (painel.contains(event.target) || !event.changedTouches.length) return;
                            const toque = event.changedTouches[0];
                            if (selecionarHotspot(toque.clientX, toque.clientY)) {
                                event.preventDefault();
                                event.stopPropagation();
                            }
                        }, { capture: true, passive: false });
                    }

                    console.log("Interação de toque dos hotspots instalada no document.");
                }

                scene.addEventListener("renderstart", instalarInteracaoHotspots);
                scene.addEventListener("loaded", instalarInteracaoHotspots);
                if (scene.hasLoaded && scene.canvas && scene.camera) {
                    instalarInteracaoHotspots();
                }


                /* ======================================
                   FECHAR PAINEL
                ======================================= */

                botaoFechar.addEventListener(
                    "click",
                    fecharPainel
                );


                /* ======================================
                   TARGET ENCONTRADO
                ======================================= */

                target.addEventListener(
                    "targetFound",
                    () => {

                        console.log(
                            "FURADEIRA ENCONTRADA"
                        );

                    }
                );


                /* ======================================
                   TARGET PERDIDO
                ======================================= */

                target.addEventListener(
                    "targetLost",
                    () => {

                        console.log(
                            "FURADEIRA PERDIDA"
                        );


                        fecharPainel();

                    }
                );


            }
        );

    </script>

</body>

</html>
