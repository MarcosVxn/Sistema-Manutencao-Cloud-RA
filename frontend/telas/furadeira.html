<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Furadeira - Realidade Aumentada</title>


    <!-- =========================================
         A-FRAME
    ========================================== -->

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>


    <!-- =========================================
         MINDAR
    ========================================== -->

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


    <!-- =========================================
         CSS
    ========================================== -->

    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            font-family: Arial, sans-serif;

            background: #000;
        }


        /* =====================================
           PAINEL DE INFORMAÇÕES
        ====================================== */

        #painelFuradeira {

            position: fixed;

            left: 50%;

            bottom: 20px;

            transform: translateX(-50%);

            width: min(90%, 420px);

            max-height: 75vh;

            overflow-y: auto;

            padding: 20px;

            background:
                rgba(15, 25, 35, 0.96);

            color: white;

            border: 2px solid #f5b400;

            border-radius: 14px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.5);

            z-index: 100;

            display: none;
        }


        #painelFuradeira h2 {

            margin-top: 8px;

            margin-bottom: 15px;

            color: #f5b400;

            font-size: 22px;
        }


        #painelFuradeira p {

            line-height: 1.5;

            margin: 9px 0;
        }


        /* =====================================
           STATUS
        ====================================== */

        .status {

            display: inline-block;

            padding: 6px 12px;

            background: #16803c;

            border-radius: 20px;

            font-size: 13px;

            margin-bottom: 8px;
        }


        /* =====================================
           BOTÕES
        ====================================== */

        .botao {

            width: 100%;

            min-height: 44px;

            padding: 12px;

            margin-top: 10px;

            border: none;

            border-radius: 6px;

            background: #f5b400;

            color: #111;

            font-weight: bold;

            cursor: pointer;

            font-size: 15px;
        }


        .botao:hover {

            background: #ffc72c;
        }


        .botao.fechar {

            background: #444;

            color: white;
        }


        .botao.fechar:hover {

            background: #555;
        }


        /* =====================================
           INSTRUÇÃO
        ====================================== */

        #instrucao {

            position: fixed;

            top: 20px;

            left: 50%;

            transform: translateX(-50%);

            z-index: 90;

            width: max-content;

            max-width: 90%;

            padding: 10px 18px;

            background:
                rgba(0, 0, 0, 0.75);

            color: white;

            border-radius: 25px;

            font-size: 14px;

            text-align: center;

            pointer-events: none;
        }


        /* =====================================
           TOAST
        ====================================== */

        #toast {

            position: fixed;

            left: 50%;

            top: 75px;

            transform: translateX(-50%);

            z-index: 200;

            padding: 10px 18px;

            border-radius: 20px;

            background:
                rgba(0, 0, 0, 0.85);

            color: white;

            display: none;

            font-size: 13px;

            text-align: center;
        }

    </style>

</head>


<body>


    <!-- =====================================
         INSTRUÇÃO
    ====================================== -->

    <div id="instrucao">

        Aponte para a furadeira

    </div>


    <!-- =====================================
         MENSAGEM
    ====================================== -->

    <div id="toast"></div>


    <!-- =====================================
         CENA DE REALIDADE AUMENTADA
    ====================================== -->

    <a-scene

        mindar-image="
            imageTargetSrc: ../assets/targets/FuradeiraTargets.mind;
            uiLoading: yes;
            uiScanning: yes;
            uiError: yes;
        "

        vr-mode-ui="enabled: false"

        device-orientation-permission-ui="enabled: false"

        renderer="colorManagement: true">


        <!-- =================================
             CÂMERA
        ================================== -->

        <a-camera

            position="0 0 0"

            look-controls="enabled: false"

            cursor="
                rayOrigin: mouse;
                fuse: false;
            "

            raycaster="
                objects: .hotspot;
            ">

        </a-camera>


        <!-- =================================
             TARGET DA FURADEIRA
        ================================== -->

        <a-entity

            id="furadeiraTarget"

            mindar-image-target="targetIndex: 0">


            <!-- =================================
                 HOTSPOT - CABEÇOTE
            ================================== -->

            <a-sphere

                class="hotspot"

                id="hotspotCabecote"

                position="-0.08 0.36 0.1"

                radius="0.05"

                material="
                    color: #f5b400;
                    opacity: 1;
                ">

            </a-sphere>


            <!-- =================================
                 HOTSPOT - INTERRUPTOR
            ================================== -->

            <a-sphere

                class="hotspot"

                id="hotspotInterruptor"

                position="0.16 0.36 0.1"

                radius="0.05"

                material="
                    color: #ff4444;
                    opacity: 1;
                ">

            </a-sphere>


            <!-- =================================
                 HOTSPOT - MOTOR
            ================================== -->

            <a-sphere

                class="hotspot"

                id="hotspotMotor"

                position="0.15 0.17 0.1"

                radius="0.05"

                material="
                    color: #2196f3;
                    opacity: 1;
                ">

            </a-sphere>


            <!-- =================================
                 HOTSPOT - MANDRIL
            ================================== -->

            <a-sphere

                class="hotspot"

                id="hotspotMandril"

                position="-0.02 0.13 0.1"

                radius="0.05"

                material="
                    color: #4caf50;
                    opacity: 1;
                ">

            </a-sphere>


            <!-- =================================
                 HOTSPOT - ALAVANCA
            ================================== -->

            <a-sphere

                class="hotspot"

                id="hotspotAlavanca"

                position="0.07 0.08 0.1"

                radius="0.05"

                material="
                    color: #9c27b0;
                    opacity: 1;
                ">

            </a-sphere>


            <!-- =================================
                 HOTSPOT - MESA
            ================================== -->

            <a-sphere

                class="hotspot"

                id="hotspotMesa"

                position="-0.02 -0.13 0.1"

                radius="0.05"

                material="
                    color: #ff9800;
                    opacity: 1;
                ">

            </a-sphere>


            <!-- =================================
                 HOTSPOT - COLUNA
            ================================== -->

            <a-sphere

                class="hotspot"

                id="hotspotColuna"

                position="0.13 -0.18 0.1"

                radius="0.05"

                material="
                    color: #00bcd4;
                    opacity: 1;
                ">

            </a-sphere>


            <!-- =================================
                 HOTSPOT - BASE
            ================================== -->

            <a-sphere

                class="hotspot"

                id="hotspotBase"

                position="-0.02 -0.38 0.1"

                radius="0.05"

                material="
                    color: #795548;
                    opacity: 1;
                ">

            </a-sphere>


        </a-entity>

    </a-scene>


    <!-- =====================================
         PAINEL DE INFORMAÇÕES
    ====================================== -->

    <div id="painelFuradeira">


        <span class="status">

            ● EQUIPAMENTO RECONHECIDO

        </span>


        <h2 id="tituloPeca">

            Furadeira Industrial

        </h2>


        <p>

            <strong>Modelo:</strong>

            <span id="modeloPeca">
                FUR-2026
            </span>

        </p>


        <p>

            <strong>Status:</strong>

            <span id="statusPeca">
                Operacional
            </span>

        </p>


        <p>

            <strong>Informações:</strong>

            <span id="descricaoPeca">
                Selecione um ponto da furadeira.
            </span>

        </p>


        <p>

            <strong>Função:</strong>

            <span id="funcaoPeca">
                -
            </span>

        </p>


        <button

            class="botao"

            id="botaoManutencao">

            Procedimentos de manutenção

        </button>


        <button

            class="botao fechar"

            id="botaoFechar">

            Fechar

        </button>


    </div>


    <!-- =====================================
         JAVASCRIPT
    ====================================== -->

    <script>


        /* =====================================
           DADOS DOS COMPONENTES
        ====================================== */

        const informacoes = {


            cabecote: {

                titulo:
                    "Cabeçote",

                modelo:
                    "CAB-2026",

                status:
                    "Operacional",

                descricao:
                    "Conjunto superior da furadeira responsável por abrigar parte do sistema de acionamento e transmissão.",

                funcao:
                    "Abrigar os mecanismos de acionamento da máquina."

            },


            interruptor: {

                titulo:
                    "Interruptor",

                modelo:
                    "INT-220",

                status:
                    "Operacional",

                descricao:
                    "Interruptor utilizado para ligar e desligar o equipamento.",

                funcao:
                    "Controlar a alimentação elétrica da máquina."

            },


            motor: {

                titulo:
                    "Motor",

                modelo:
                    "MTR-500",

                status:
                    "Operacional",

                descricao:
                    "Motor elétrico responsável por fornecer a potência necessária para o sistema de perfuração.",

                funcao:
                    "Converter energia elétrica em movimento rotacional."

            },


            mandril: {

                titulo:
                    "Mandril",

                modelo:
                    "MDR-16",

                status:
                    "Operacional",

                descricao:
                    "Componente responsável por prender e centralizar a broca.",

                funcao:
                    "Fixar a ferramenta de corte."

            },


            alavanca: {

                titulo:
                    "Alavanca de avanço",

                modelo:
                    "ALV-300",

                status:
                    "Operacional",

                descricao:
                    "Mecanismo utilizado para movimentar verticalmente o conjunto de perfuração.",

                funcao:
                    "Controlar o avanço da broca."

            },


            mesa: {

                titulo:
                    "Mesa de trabalho",

                modelo:
                    "MESA-400",

                status:
                    "Operacional",

                descricao:
                    "Superfície onde a peça de trabalho é apoiada durante a operação.",

                funcao:
                    "Sustentar e posicionar a peça."

            },


            coluna: {

                titulo:
                    "Coluna",

                modelo:
                    "COL-500",

                status:
                    "Operacional",

                descricao:
                    "Estrutura vertical que sustenta o conjunto superior da máquina.",

                funcao:
                    "Garantir sustentação e alinhamento."

            },


            base: {

                titulo:
                    "Base",

                modelo:
                    "BAS-600",

                status:
                    "Operacional",

                descricao:
                    "Estrutura inferior responsável pelo apoio e estabilidade da furadeira.",

                funcao:
                    "Garantir estabilidade durante a operação."

            }

        };


        /* =====================================
           ELEMENTOS DO PAINEL
        ====================================== */

        const painel =
            document.querySelector(
                "#painelFuradeira"
            );


        const titulo =
            document.querySelector(
                "#tituloPeca"
            );


        const modelo =
            document.querySelector(
                "#modeloPeca"
            );


        const status =
            document.querySelector(
                "#statusPeca"
            );


        const descricao =
            document.querySelector(
                "#descricaoPeca"
            );


        const funcao =
            document.querySelector(
                "#funcaoPeca"
            );


        const instrucao =
            document.querySelector(
                "#instrucao"
            );


        const toast =
            document.querySelector(
                "#toast"
            );


        /* =====================================
           ABRIR INFORMAÇÃO
        ====================================== */

        function abrirInformacao(tipo) {


            const info =
                informacoes[tipo];


            if (!info) {

                console.warn(
                    "Informação não encontrada:",
                    tipo
                );

                return;

            }


            titulo.textContent =
                info.titulo;


            modelo.textContent =
                info.modelo;


            status.textContent =
                info.status;


            descricao.textContent =
                info.descricao;


            funcao.textContent =
                info.funcao;


            painel.style.display =
                "block";


            instrucao.style.display =
                "none";


            console.log(
                "Hotspot selecionado:",
                tipo
            );

        }


        /* =====================================
           FECHAR PAINEL
        ====================================== */

        function fecharPainel() {

            painel.style.display =
                "none";


            instrucao.style.display =
                "block";

        }


        /* =====================================
           PROCEDIMENTOS DE MANUTENÇÃO
        ====================================== */

        function mostrarManutencao() {

            mostrarToast(
                "Procedimentos de manutenção selecionados."
            );

        }


        /* =====================================
           TOAST
        ====================================== */

        function mostrarToast(mensagem) {

            toast.textContent =
                mensagem;


            toast.style.display =
                "block";


            setTimeout(() => {

                toast.style.display =
                    "none";

            }, 2500);

        }


        /* =====================================
           HOTSPOTS
        ====================================== */

        document
            .querySelector("#hotspotCabecote")
            .addEventListener(
                "click",
                () => {

                    abrirInformacao(
                        "cabecote"
                    );

                }
            );


        document
            .querySelector("#hotspotInterruptor")
            .addEventListener(
                "click",
                () => {

                    abrirInformacao(
                        "interruptor"
                    );

                }
            );


        document
            .querySelector("#hotspotMotor")
            .addEventListener(
                "click",
                () => {

                    abrirInformacao(
                        "motor"
                    );

                }
            );


        document
            .querySelector("#hotspotMandril")
            .addEventListener(
                "click",
                () => {

                    abrirInformacao(
                        "mandril"
                    );

                }
            );


        document
            .querySelector("#hotspotAlavanca")
            .addEventListener(
                "click",
                () => {

                    abrirInformacao(
                        "alavanca"
                    );

                }
            );


        document
            .querySelector("#hotspotMesa")
            .addEventListener(
                "click",
                () => {

                    abrirInformacao(
                        "mesa"
                    );

                }
            );


        document
            .querySelector("#hotspotColuna")
            .addEventListener(
                "click",
                () => {

                    abrirInformacao(
                        "coluna"
                    );

                }
            );


        document
            .querySelector("#hotspotBase")
            .addEventListener(
                "click",
                () => {

                    abrirInformacao(
                        "base"
                    );

                }
            );


        /* =====================================
           BOTÃO FECHAR
        ====================================== */

        document
            .querySelector("#botaoFechar")
            .addEventListener(
                "click",
                fecharPainel
            );


        /* =====================================
           BOTÃO MANUTENÇÃO
        ====================================== */

        document
            .querySelector("#botaoManutencao")
            .addEventListener(
                "click",
                mostrarManutencao
            );


        /* =====================================
           TARGET MINDAR
        ====================================== */

        const target =
            document.querySelector(
                "#furadeiraTarget"
            );


        target.addEventListener(
            "targetFound",
            () => {

                console.log(
                    "================================"
                );

                console.log(
                    "FURADEIRA ENCONTRADA!"
                );

                console.log(
                    "================================"
                );


                instrucao.textContent =
                    "Toque nos pontos para obter informações";


                instrucao.style.display =
                    "block";

            }
        );


        target.addEventListener(
            "targetLost",
            () => {

                console.log(
                    "Furadeira perdida"
                );


                painel.style.display =
                    "none";


                instrucao.textContent =
                    "Aponte para a furadeira";

            }
        );


        /* =====================================
           A-FRAME
        ====================================== */

        const scene =
            document.querySelector(
                "a-scene"
            );


        scene.addEventListener(
            "loaded",
            () => {

                console.log(
                    "A-Frame carregado"
                );

            }
        );


        scene.addEventListener(
            "renderstart",
            () => {

                console.log(
                    "Renderização iniciada"
                );

            }
        );


    </script>


</body>

</html>
