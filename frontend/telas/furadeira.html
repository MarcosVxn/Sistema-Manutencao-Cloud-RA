<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Furadeira - Realidade Aumentada</title>

    <!-- A-FRAME -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- MINDAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            overflow: hidden;

            font-family: Arial, sans-serif;

        }


        /* ==========================================
           PAINEL
        ========================================== */

        #painelFuradeira {

            position: fixed;

            left: 50%;

            bottom: 20px;

            transform: translateX(-50%);

            width: min(90%, 400px);

            padding: 20px;

            background:
                rgba(15, 25, 35, 0.95);

            color: white;

            border: 2px solid #f5b400;

            border-radius: 12px;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.5);

            z-index: 100;

            display: none;

        }


        #painelFuradeira h2 {

            margin-top: 0;

            color: #f5b400;

        }


        #painelFuradeira p {

            line-height: 1.5;

        }


        .status {

            display: inline-block;

            padding: 6px 12px;

            background: #16803c;

            border-radius: 20px;

            font-size: 13px;

            margin-bottom: 10px;

        }


        .botao {

            width: 100%;

            padding: 12px;

            margin-top: 10px;

            border: none;

            border-radius: 6px;

            background: #f5b400;

            color: #111;

            font-weight: bold;

            cursor: pointer;

        }

    </style>

</head>


<body>


    <!-- ==========================================
         CENA AR

         NÃO ALTERAMOS A CONFIGURAÇÃO QUE
         ESTAVA FUNCIONANDO.
    ========================================== -->

    <a-scene

        mindar-image="
            imageTargetSrc: ../assets/targets/FuradeiraTargets.mind;
            uiLoading: yes;
            uiScanning: yes;
            uiError: yes;
        "

        vr-mode-ui="enabled: false"

        device-orientation-permission-ui="enabled: false"

        renderer="colorManagement: true">


        <!-- CÂMERA -->

        <a-camera

            position="0 0 0"

            look-controls="enabled: false">

        </a-camera>


        <!-- TARGET -->

        <a-entity

            id="furadeiraTarget"

            mindar-image-target="targetIndex: 0">


            <!-- ======================================
                 PONTO 1
            ======================================= -->

            <a-sphere

                class="hotspot"

                data-topic="cabecote"

                position="-0.08 0.36 0.1"

                radius="0.05"

                material="color: #f5b400;">

            </a-sphere>


            <!-- ======================================
                 PONTO 2
            ======================================= -->

            <a-sphere

                class="hotspot"

                data-topic="interruptor"

                position="0.16 0.36 0.1"

                radius="0.05"

                material="color: #ff4444;">

            </a-sphere>


            <!-- ======================================
                 PONTO 3
            ======================================= -->

            <a-sphere

                class="hotspot"

                data-topic="motor"

                position="0.15 0.17 0.1"

                radius="0.05"

                material="color: #2196f3;">

            </a-sphere>


            <!-- ======================================
                 PONTO 4
            ======================================= -->

            <a-sphere

                class="hotspot"

                data-topic="mandril"

                position="-0.02 0.13 0.1"

                radius="0.05"

                material="color: #4caf50;">

            </a-sphere>


            <!-- ======================================
                 PONTO 5
            ======================================= -->

            <a-sphere

                class="hotspot"

                data-topic="alavanca"

                position="0.07 0.08 0.1"

                radius="0.05"

                material="color: #9c27b0;">

            </a-sphere>


            <!-- ======================================
                 PONTO 6
            ======================================= -->

            <a-sphere

                class="hotspot"

                data-topic="mesa"

                position="-0.02 -0.13 0.1"

                radius="0.05"

                material="color: #ff9800;">

            </a-sphere>


            <!-- ======================================
                 PONTO 7
            ======================================= -->

            <a-sphere

                class="hotspot"

                data-topic="coluna"

                position="0.13 -0.18 0.1"

                radius="0.05"

                material="color: #00bcd4;">

            </a-sphere>


            <!-- ======================================
                 PONTO 8
            ======================================= -->

            <a-sphere

                class="hotspot"

                data-topic="base"

                position="-0.02 -0.38 0.1"

                radius="0.05"

                material="color: #795548;">

            </a-sphere>


        </a-entity>

    </a-scene>


    <!-- ==========================================
         PAINEL
    ========================================== -->

    <div id="painelFuradeira">


        <span class="status">

            ● COMPONENTE SELECIONADO

        </span>


        <h2 id="tituloPeca">
            Componente
        </h2>


        <p>

            <strong>Descrição:</strong>

        </p>


        <p id="descricaoPeca">
            -
        </p>


        <p>

            <strong>Detalhes:</strong>

        </p>


        <p id="detalhesPeca">
            -
        </p>


        <button
            id="botaoFechar"
            class="botao">

            Fechar

        </button>


    </div>


    <!-- ==========================================
         JAVASCRIPT
    ========================================== -->

    <script>


        document.addEventListener(
            "DOMContentLoaded",
            () => {


                /* ======================================
                   ELEMENTOS
                ======================================= */

                const target =
                    document.querySelector(
                        "#furadeiraTarget"
                    );


                const painel =
                    document.querySelector(
                        "#painelFuradeira"
                    );


                const titulo =
                    document.querySelector(
                        "#tituloPeca"
                    );


                const descricao =
                    document.querySelector(
                        "#descricaoPeca"
                    );


                const detalhes =
                    document.querySelector(
                        "#detalhesPeca"
                    );


                const botaoFechar =
                    document.querySelector(
                        "#botaoFechar"
                    );


                const hotspots =
                    document.querySelectorAll(
                        ".hotspot"
                    );


                /* ======================================
                   INFORMAÇÕES
                ======================================= */

                const information = {


                    cabecote: {

                        title: "Cabeçote",

                        text:
                            "Conjunto superior da furadeira responsável pelo acionamento e transmissão.",

                        detail:
                            "Verifique fixações, ruídos, vibrações e sinais de desgaste."

                    },


                    interruptor: {

                        title: "Interruptor",

                        text:
                            "Componente utilizado para ligar e desligar o equipamento.",

                        detail:
                            "Antes de manutenção elétrica, desligue a alimentação da máquina."

                    },


                    motor: {

                        title: "Motor",

                        text:
                            "Motor elétrico responsável pelo movimento rotacional.",

                        detail:
                            "Observe aquecimento excessivo, ruídos e vibrações."

                    },


                    mandril: {

                        title: "Mandril",

                        text:
                            "Componente responsável pela fixação da broca.",

                        detail:
                            "Certifique-se de que a broca está corretamente fixada."

                    },


                    alavanca: {

                        title: "Alavanca de avanço",

                        text:
                            "Mecanismo utilizado para movimentar o conjunto de perfuração.",

                        detail:
                            "O movimento deve ocorrer de forma controlada."

                    },


                    mesa: {

                        title: "Mesa de trabalho",

                        text:
                            "Superfície utilizada para apoiar a peça.",

                        detail:
                            "A peça deve estar corretamente apoiada e fixada."

                    },


                    coluna: {

                        title: "Coluna",

                        text:
                            "Estrutura vertical que sustenta o conjunto superior.",

                        detail:
                            "Contribui para o alinhamento e estabilidade."

                    },


                    base: {

                        title: "Base",

                        text:
                            "Estrutura inferior responsável pelo apoio da furadeira.",

                        detail:
                            "Verifique a fixação e estabilidade da máquina."

                    }

                };


                /* ======================================
                   MOSTRAR INFORMAÇÃO
                ======================================= */

                function mostrarInformacao(
                    topic
                ) {


                    const info =
                        information[topic];


                    if (!info) {

                        return;

                    }


                    titulo.textContent =
                        info.title;


                    descricao.textContent =
                        info.text;


                    detalhes.textContent =
                        info.detail;


                    painel.style.display =
                        "block";

                }


                /* ======================================
                   FECHAR
                ======================================= */

                function fecharPainel() {

                    painel.style.display =
                        "none";

                }


                /* ======================================
                   INTERAÇÃO DOS PONTOS

                   Não adicionamos:
                   - cursor
                   - raycaster
                   - THREE.Vector3
                   - projeção
                   - posicionamento HTML

                   A cena AR permanece intacta.
                ======================================= */

                hotspots.forEach(
                    (hotspot) => {


                        hotspot.addEventListener(
                            "click",
                            () => {


                                const topic =
                                    hotspot.getAttribute(
                                        "data-topic"
                                    );


                                mostrarInformacao(
                                    topic
                                );

                            }
                        );


                    }
                );


                /* ======================================
                   FECHAR PAINEL
                ======================================= */

                botaoFechar.addEventListener(
                    "click",
                    fecharPainel
                );


                /* ======================================
                   TARGET ENCONTRADO
                ======================================= */

                target.addEventListener(
                    "targetFound",
                    () => {

                        console.log(
                            "FURADEIRA ENCONTRADA"
                        );

                    }
                );


                /* ======================================
                   TARGET PERDIDO
                ======================================= */

                target.addEventListener(
                    "targetLost",
                    () => {

                        console.log(
                            "FURADEIRA PERDIDA"
                        );


                        fecharPainel();

                    }
                );


            }
        );

    </script>

</body>

</html>
