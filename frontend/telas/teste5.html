<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Teste 5 - Raycaster</title>


    <!-- =====================================================
         A-FRAME
    ====================================================== -->

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>


    <!-- =====================================================
         MINDAR
    ====================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


    <style>

        html,
        body {

            margin: 0;

            padding: 0;

            width: 100%;

            height: 100%;

            overflow: hidden;

            background: #000;

        }

    </style>

</head>


<body>


    <!-- =====================================================
         CENA AR
    ====================================================== -->

    <a-scene

        id="ar-scene"

        mindar-image="
            imageTargetSrc: ../assets/targets/FuradeiraTargets.mind;
            uiLoading: yes;
            uiScanning: yes;
            uiError: yes;
        "

        vr-mode-ui="enabled: false"

        device-orientation-permission-ui="enabled: false"

        renderer="colorManagement: true">


        <!-- =================================================
             CÂMERA

             NÃO modificar.
        ================================================== -->

        <a-camera

            id="ar-camera"

            position="0 0 0"

            look-controls="enabled: false">

        </a-camera>


        <!-- =================================================
             TARGET
        ================================================== -->

        <a-entity

            id="furadeiraTarget"

            mindar-image-target="targetIndex: 0">


            <!-- =================================================
                 HOTSPOT
            ================================================== -->

            <a-sphere

                class="hotspot"

                data-topic="motor"

                position="0 0 0"

                radius="0.08"

                material="
                    color: red;
                    opacity: 1;
                ">

            </a-sphere>


        </a-entity>


    </a-scene>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            () => {


                console.log(
                    "================================"
                );

                console.log(
                    "TESTE 5 INICIADO"
                );

                console.log(
                    "================================"
                );


                const scene =
                    document.querySelector(
                        "#ar-scene"
                    );


                /* =================================================
                   ESPERA O A-FRAME INICIAR
                ================================================== */

                scene.addEventListener(
                    "renderstart",
                    () => {


                        console.log(
                            "Renderização iniciada."
                        );


                        /* =========================================
                           VERIFICA THREE.JS
                        ========================================== */

                        console.log(
                            "THREE:",
                            typeof THREE
                        );


                        if (
                            typeof THREE ===
                            "undefined"
                        ) {

                            console.error(
                                "ERRO: THREE não está disponível."
                            );

                            return;

                        }


                        console.log(
                            "SUCESSO: THREE está disponível."
                        );


                        /* =========================================
                           VERIFICA RAYCASTER
                        ========================================== */

                        console.log(
                            "THREE.Raycaster:",
                            typeof THREE.Raycaster
                        );


                        if (
                            typeof THREE.Raycaster !==
                            "function"
                        ) {

                            console.error(
                                "ERRO: THREE.Raycaster não está disponível."
                            );

                            return;

                        }


                        console.log(
                            "SUCESSO: THREE.Raycaster está disponível."
                        );


                        /* =========================================
                           CRIA O RAYCASTER
                           
                           IMPORTANTE:
                           ainda NÃO estamos usando o raycaster.
                        ========================================== */

                        try {

                            const raycaster =
                                new THREE.Raycaster();


                            console.log(
                                "RAYCASTER CRIADO:",
                                raycaster
                            );


                            console.log(
                                "================================"
                            );

                            console.log(
                                "TESTE 5 PASSOU"
                            );

                            console.log(
                                "================================"
                            );


                        } catch (erro) {

                            console.error(
                                "================================"
                            );

                            console.error(
                                "ERRO AO CRIAR RAYCASTER"
                            );

                            console.error(
                                erro
                            );

                            console.error(
                                "================================"
                            );

                        }

                    }
                );


            }
        );

    </script>


</body>

</html>
