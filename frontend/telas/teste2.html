<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Teste 2 - Data Topic</title>


    <!-- A-FRAME -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>


    <!-- MINDAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


    <style>

        html,
        body {

            margin: 0;

            padding: 0;

            width: 100%;

            height: 100%;

            overflow: hidden;

            background: #000;

        }

    </style>

</head>


<body>


    <!-- =====================================================
         CENA AR
    ====================================================== -->

    <a-scene

        id="ar-scene"

        mindar-image="
            imageTargetSrc: ../assets/targets/FuradeiraTargets.mind;
            uiLoading: yes;
            uiScanning: yes;
            uiError: yes;
        "

        vr-mode-ui="enabled: false"

        device-orientation-permission-ui="enabled: false"

        renderer="colorManagement: true">


        <!-- =================================================
             CÂMERA

             Mantemos exatamente como no Teste 1.
        ================================================== -->

        <a-camera

            id="ar-camera"

            position="0 0 0"

            look-controls="enabled: false">

        </a-camera>


        <!-- =================================================
             TARGET
        ================================================== -->

        <a-entity

            id="furadeiraTarget"

            mindar-image-target="targetIndex: 0">


            <!-- =================================================
                 HOTSPOT
            ================================================== -->

            <a-sphere

                class="hotspot"

                data-topic="motor"

                position="0 0 0"

                radius="0.05"

                material="color: red;">

            </a-sphere>


        </a-entity>


    </a-scene>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            () => {


                console.log(
                    "================================"
                );

                console.log(
                    "TESTE 2 INICIADO"
                );

                console.log(
                    "================================"
                );


                /* =================================================
                   LOCALIZA O HOTSPOT
                ================================================== */

                const hotspot =
                    document.querySelector(
                        ".hotspot"
                    );


                console.log(
                    "HOTSPOT:",
                    hotspot
                );


                /* =================================================
                   VERIFICA SE O HOTSPOT EXISTE
                ================================================== */

                if (!hotspot) {

                    console.error(
                        "ERRO: hotspot não encontrado."
                    );

                    return;

                }


                console.log(
                    "SUCESSO: hotspot encontrado."
                );


                /* =================================================
                   LÊ O DATA-TOPIC
                ================================================== */

                const topic =
                    hotspot.dataset.topic;


                console.log(
                    "DATA-TOPIC:",
                    topic
                );


                /* =================================================
                   VERIFICAÇÃO FINAL
                ================================================== */

                if (topic === "motor") {

                    console.log(
                        "SUCESSO: data-topic está funcionando."
                    );

                } else {

                    console.error(
                        "ERRO: data-topic possui valor inesperado."
                    );

                }


            }
        );

    </script>


</body>

</html>
