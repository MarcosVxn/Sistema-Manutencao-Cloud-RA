<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Teste 3 - Clique no Hotspot</title>


    <!-- =====================================================
         A-FRAME
    ====================================================== -->

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>


    <!-- =====================================================
         MINDAR
    ====================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


    <style>

        html,
        body {

            margin: 0;

            padding: 0;

            width: 100%;

            height: 100%;

            overflow: hidden;

            background: #000;

        }

    </style>

</head>


<body>


    <!-- =====================================================
         CENA AR
    ====================================================== -->

    <a-scene

        id="ar-scene"

        mindar-image="
            imageTargetSrc: ../assets/targets/FuradeiraTargets.mind;
            uiLoading: yes;
            uiScanning: yes;
            uiError: yes;
        "

        vr-mode-ui="enabled: false"

        device-orientation-permission-ui="enabled: false"

        renderer="colorManagement: true">


        <!-- =================================================
             CÂMERA

             NÃO alterar.
        ================================================== -->

        <a-camera

            id="ar-camera"

            position="0 0 0"

            look-controls="enabled: false">

        </a-camera>


        <!-- =================================================
             TARGET
        ================================================== -->

        <a-entity

            id="furadeiraTarget"

            mindar-image-target="targetIndex: 0">


            <!-- =================================================
                 HOTSPOT
            ================================================== -->

            <a-sphere

                class="hotspot"

                data-topic="motor"

                position="0 0 0"

                radius="0.08"

                material="
                    color: red;
                    opacity: 1;
                ">

            </a-sphere>


        </a-entity>


    </a-scene>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            () => {


                console.log(
                    "================================"
                );

                console.log(
                    "TESTE 3 INICIADO"
                );

                console.log(
                    "================================"
                );


                /* =================================================
                   LOCALIZA O HOTSPOT
                ================================================== */

                const hotspot =
                    document.querySelector(
                        ".hotspot"
                    );


                if (!hotspot) {

                    console.error(
                        "ERRO: hotspot não encontrado."
                    );

                    return;

                }


                console.log(
                    "Hotspot encontrado."
                );


                /* =================================================
                   TESTE DE CLICK
                ================================================= */

                hotspot.addEventListener(
                    "click",
                    () => {

                        console.log(
                            "================================"
                        );

                        console.log(
                            "CLIQUE RECEBIDO!"
                        );

                        console.log(
                            "O hotspot recebeu o evento click."
                        );

                        console.log(
                            "================================"
                        );


                        alert(
                            "PONTO CLICADO!"
                        );

                    }
                );


                console.log(
                    "Evento click configurado."
                );


            }
        );

    </script>


</body>

</html>
