<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Teste 1 - Hotspot</title>


    <!-- =====================================================
         A-FRAME
    ====================================================== -->

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>


    <!-- =====================================================
         MINDAR
    ====================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


    <style>

        html,
        body {

            margin: 0;

            padding: 0;

            width: 100%;

            height: 100%;

            overflow: hidden;

            background: #000;

        }

    </style>

</head>


<body>


    <!-- =====================================================
         CENA DE REALIDADE AUMENTADA

         Esta parte permanece simples e igual à versão
         que você informou estar funcionando.
    ====================================================== -->

    <a-scene

        id="ar-scene"

        mindar-image="
            imageTargetSrc: ../assets/targets/FuradeiraTargets.mind;
            uiLoading: yes;
            uiScanning: yes;
            uiError: yes;
        "

        vr-mode-ui="enabled: false"

        device-orientation-permission-ui="enabled: false"

        renderer="colorManagement: true">


        <!-- =================================================
             CÂMERA

             NÃO adicionamos cursor ou raycaster.
        ================================================== -->

        <a-camera

            id="ar-camera"

            position="0 0 0"

            look-controls="enabled: false">

        </a-camera>


        <!-- =================================================
             TARGET
        ================================================== -->

        <a-entity

            id="furadeiraTarget"

            mindar-image-target="targetIndex: 0">


            <!-- =================================================
                 HOTSPOT DE TESTE

                 É apenas um ponto vermelho.
            ================================================== -->

            <a-sphere

                class="hotspot"

                data-topic="motor"

                position="0 0 0"

                radius="0.05"

                material="color: red;">

            </a-sphere>


        </a-entity>


    </a-scene>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            () => {


                console.log(
                    "================================"
                );

                console.log(
                    "TESTE 1 INICIADO"
                );

                console.log(
                    "================================"
                );


                /* =================================================
                   LOCALIZA O HOTSPOT
                ================================================== */

                const hotspot =
                    document.querySelector(
                        ".hotspot"
                    );


                /* =================================================
                   MOSTRA O RESULTADO
                ================================================== */

                console.log(
                    "HOTSPOT:",
                    hotspot
                );


                /* =================================================
                   VERIFICAÇÃO
                ================================================== */

                if (hotspot) {

                    console.log(
                        "SUCESSO: hotspot encontrado."
                    );

                } else {

                    console.error(
                        "ERRO: hotspot NÃO encontrado."
                    );

                }


            }
        );


    </script>


</body>

</html>
