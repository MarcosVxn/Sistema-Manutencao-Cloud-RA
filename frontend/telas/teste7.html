<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Teste 7 - Toque e Raycaster</title>


    <!-- =====================================================
         A-FRAME
    ====================================================== -->

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>


    <!-- =====================================================
         MINDAR
    ====================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


    <style>

        html,
        body {

            margin: 0;

            padding: 0;

            width: 100%;

            height: 100%;

            overflow: hidden;

            background: #000;

        }

    </style>

</head>


<body>


    <!-- =====================================================
         CENA AR
    ====================================================== -->

    <a-scene

        id="ar-scene"

        mindar-image="
            imageTargetSrc: ../assets/targets/FuradeiraTargets.mind;
            uiLoading: yes;
            uiScanning: yes;
            uiError: yes;
        "

        vr-mode-ui="enabled: false"

        device-orientation-permission-ui="enabled: false"

        renderer="colorManagement: true">


        <!-- =================================================
             CÂMERA

             IMPORTANTE:
             NÃO adicionamos cursor.
             NÃO adicionamos raycaster.
        ================================================== -->

        <a-camera

            id="ar-camera"

            position="0 0 0"

            look-controls="enabled: false">

        </a-camera>


        <!-- =================================================
             TARGET
        ================================================== -->

        <a-entity

            id="furadeiraTarget"

            mindar-image-target="targetIndex: 0">


            <!-- =================================================
                 HOTSPOT 1
            ================================================== -->

            <a-sphere

                class="hotspot"

                data-topic="motor"

                position="0 0 0"

                radius="0.08"

                material="color: red;">

            </a-sphere>


            <!-- =================================================
                 HOTSPOT 2
            ================================================== -->

            <a-sphere

                class="hotspot"

                data-topic="mandril"

                position="0.2 0.1 0"

                radius="0.08"

                material="color: blue;">

            </a-sphere>


            <!-- =================================================
                 HOTSPOT 3
            ================================================== -->

            <a-sphere

                class="hotspot"

                data-topic="cabecote"

                position="-0.2 0.1 0"

                radius="0.08"

                material="color: green;">

            </a-sphere>


        </a-entity>


    </a-scene>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            () => {


                console.log(
                    "================================"
                );

                console.log(
                    "TESTE 7 INICIADO"
                );

                console.log(
                    "================================"
                );


                const scene =
                    document.querySelector(
                        "#ar-scene"
                    );


                const canvas =
                    scene.renderer &&
                    scene.renderer.domElement;


                /*
                 * O renderer pode ainda não existir
                 * neste momento.
                 *
                 * Por isso vamos configurar tudo
                 * dentro do renderstart.
                 */


                scene.addEventListener(
                    "renderstart",
                    () => {


                        console.log(
                            "Renderização iniciada."
                        );


                        /* =========================================
                           CÂMERA
                        ========================================== */

                        const camera =
                            scene.camera;


                        if (!camera) {

                            console.error(
                                "ERRO: câmera não encontrada."
                            );

                            return;

                        }


                        console.log(
                            "Câmera encontrada."
                        );


                        /* =========================================
                           CANVAS
                        ========================================== */

                        const canvas =
                            scene.renderer &&
                            scene.renderer.domElement;


                        if (!canvas) {

                            console.error(
                                "ERRO: canvas não encontrado."
                            );

                            return;

                        }


                        console.log(
                            "Canvas encontrado."
                        );


                        /* =========================================
                           RAYCASTER
                        ========================================== */

                        const raycaster =
                            new THREE.Raycaster();


                        console.log(
                            "Raycaster criado."
                        );


                        /* =========================================
                           VETOR 2D
                        ========================================== */

                        const mouse =
                            new THREE.Vector2();


                        /* =========================================
                           HOTSPOTS
                        ========================================== */

                        const hotspots =
                            Array.from(
                                document.querySelectorAll(
                                    ".hotspot"
                                )
                            );


                        console.log(
                            "Hotspots:",
                            hotspots.length
                        );


                        /* =========================================
                           OBJECT3D DOS HOTSPOTS
                        ========================================== */

                        const objetos =
                            hotspots
                                .map(
                                    hotspot =>
                                        hotspot.object3D
                                )
                                .filter(
                                    object =>
                                        object
                                );


                        console.log(
                            "Objetos 3D:",
                            objetos
                        );


                        /* =========================================
                           EVENTO DE TOQUE
                        ========================================== */

                        canvas.addEventListener(
                            "pointerup",
                            (event) => {


                                console.log(
                                    "--------------------------------"
                                );

                                console.log(
                                    "TOQUE RECEBIDO"
                                );


                                /* =============================
                                   TAMANHO DO CANVAS
                                ============================== */

                                const rect =
                                    canvas.getBoundingClientRect();


                                console.log(
                                    "Canvas:",
                                    rect
                                );


                                /* =============================
                                   COORDENADAS DO TOQUE
                                ============================== */

                                const x =
                                    event.clientX -
                                    rect.left;


                                const y =
                                    event.clientY -
                                    rect.top;


                                console.log(
                                    "Toque X:",
                                    x
                                );


                                console.log(
                                    "Toque Y:",
                                    y
                                );


                                /* =============================
                                   NORMALIZAÇÃO
                                   
                                   Converte:
                                   
                                   0 → largura
                                   
                                   para:
                                   
                                   -1 → +1
                                ============================== */

                                mouse.x =
                                    (
                                        x /
                                        rect.width
                                    ) * 2 - 1;


                                mouse.y =
                                    -(
                                        y /
                                        rect.height
                                    ) * 2 + 1;


                                console.log(
                                    "Mouse normalizado X:",
                                    mouse.x
                                );


                                console.log(
                                    "Mouse normalizado Y:",
                                    mouse.y
                                );


                                /* =============================
                                   CRIA O RAY
                                ============================== */

                                raycaster.setFromCamera(
                                    mouse,
                                    camera
                                );


                                console.log(
                                    "Ray criado."
                                );


                                /* =============================
                                   PROCURA INTERSEÇÕES
                                ============================== */

                                const intersections =
                                    raycaster.intersectObjects(
                                        objetos,
                                        true
                                    );


                                console.log(
                                    "Interseções:",
                                    intersections
                                );


                                /* =============================
                                   NENHUM PONTO
                                ============================== */

                                if (
                                    intersections.length === 0
                                ) {

                                    console.log(
                                        "Nenhum hotspot atingido."
                                    );

                                    console.log(
                                        "--------------------------------"
                                    );

                                    return;

                                }


                                /* =============================
                                   PONTO ATINGIDO
                                ============================== */

                                const objetoAtingido =
                                    intersections[0].object;


                                console.log(
                                    "OBJETO ATINGIDO:",
                                    objetoAtingido
                                );


                                /* =============================
                                   IDENTIFICA O HOTSPOT
                                ============================== */

                                let hotspotEncontrado =
                                    null;


                                for (
                                    const hotspot
                                    of hotspots
                                ) {


                                    if (
                                        hotspot.object3D ===
                                        objetoAtingido
                                    ) {

                                        hotspotEncontrado =
                                            hotspot;

                                        break;

                                    }


                                    /*
                                     * Também verifica se o objeto
                                     * atingido é filho do hotspot.
                                     */

                                    if (
                                        hotspot.object3D.contains(
                                            objetoAtingido
                                        )
                                    ) {

                                        hotspotEncontrado =
                                            hotspot;

                                        break;

                                    }

                                }


                                /* =============================
                                   RESULTADO
                                ============================== */

                                if (
                                    hotspotEncontrado
                                ) {

                                    console.log(
                                        "================================"
                                    );

                                    console.log(
                                        "HOTSPOT ATINGIDO!"
                                    );

                                    console.log(
                                        "TOPIC:",
                                        hotspotEncontrado.dataset.topic
                                    );

                                    console.log(
                                        "================================"
                                    );


                                    alert(
                                        "Hotspot: " +
                                        hotspotEncontrado.dataset.topic
                                    );

                                } else {

                                    console.log(
                                        "Objeto atingido, mas hotspot não identificado."
                                    );

                                }


                            },

                            {
                                passive: false
                            }

                        );


                        console.log(
                            "================================"
                        );

                        console.log(
                            "TESTE 7 PRONTO"
                        );

                        console.log(
                            "Toque em um dos pontos."
                        );

                        console.log(
                            "================================"
                        );


                    }
                );


            }
        );

    </script>


</body>

</html>
